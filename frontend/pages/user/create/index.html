<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Team</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">

    <link rel="icon" href="/frontend/assets/images/icon.png">

    <script>
        try {
            if (localStorage.getItem('theme') === 'light')
                document.documentElement.classList.add('light-mode')
        } catch (e) { }
    </script>



</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- ================= CONTENT ================= -->

    <section class="container" style="margin-top:120px; margin-bottom:80px;">

        <h1 class="page-title text-center mb-5">
            Create a Team
        </h1>

        <div class="glass-box p-4 create-team-container">

            <!-- Avatar Upload -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Team Avatar
                </label>

                <input type="file" id="avatarInput" accept="image/*" hidden>

                <label for="avatarInput" class="upload-box w-100">

                    <img id="avatarPreview" class="preview-avatar mb-3">

                    <div id="uploadContent">

                        <i class="bi bi-cloud-arrow-up"></i>

                        <h6 class="mt-3">
                            Click or drag image here
                        </h6>

                        <small class="text-secondary">
                            PNG, JPG, WEBP supported
                        </small>

                    </div>

                </label>

            </div>

            <!-- Team Name -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Team Name
                </label>

                <input type="text"
                    class="form-control"
                    placeholder="Enter your team name">

            </div>

            <!-- Shoutout -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Shoutout (Optional)
                </label>

                <textarea
                    class="form-control"
                    rows="4"
                    placeholder="Give your team a short description..."></textarea>

            </div>

            <!-- Visibility -->
            <div class="mb-4">

                <label class="form-label fw-semibold d-block mb-3">
                    Team Visibility
                </label>

                <div class="row g-3">

                    <div class="col-md-6">

                        <div class="visibility-card active" data-type="public">

                            <div class="fw-bold">
                                <i class="bi bi-globe me-2"></i>
                                Public
                            </div>

                            <small class="text-secondary">
                                Anyone can discover and request to join.
                            </small>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="visibility-card" data-type="private">

                            <div class="fw-bold">
                                <i class="bi bi-lock-fill me-2"></i>
                                Private
                            </div>

                            <small class="text-secondary">
                                Only invited members can join.
                            </small>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Buttons -->
            <div class="d-grid gap-3">

                <button class="btn btn-lg create-btn text-white">
                    Create Team
                </button>

                <button class="btn btn-outline-light">
                    Cancel
                </button>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Components -->
    <script src="/frontend/components/navbar-user.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>

    <!-- Firebase -->
    <script src="/frontend/utils/constants.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Services -->
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/authService.js"></script>

    <script>
        checkAuth();

        // Avatar Preview
        const avatarInput = document.getElementById("avatarInput");
        const avatarPreview = document.getElementById("avatarPreview");
        const uploadContent = document.getElementById("uploadContent");

        avatarInput.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) return;

            avatarPreview.src = URL.createObjectURL(file);
            avatarPreview.style.display = "block";

            uploadContent.style.display = "none";

        });

        // Visibility Toggle
        const visibilityCards = document.querySelectorAll(".visibility-card");

        visibilityCards.forEach(card => {

            card.addEventListener("click", () => {

                visibilityCards.forEach(c =>
                    c.classList.remove("active")
                );

                card.classList.add("active");

            });

        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
