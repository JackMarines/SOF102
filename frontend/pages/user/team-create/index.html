<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')}catch(e){}</script>
</head>

<body data-auth="user">
    <div id="navbar"></div>

    <section class="container" style="margin-top:120px; margin-bottom:80px;">
        <h1 class="page-title text-center mb-5">Create a Team</h1>

        <div class="glass-box p-4 create-team-container">

            <!-- Team Name -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Team Name</label>
                <input type="text" id="create-team-name" class="form-control" placeholder="Enter your team name" maxlength="100">
                <!-- Inline error for duplicate team names -->
            <div id="create-team-name-error" class="text-danger small mt-1 d-none"></div>
            </div>

            <!-- Static image upload placeholder (no functionality yet) -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Team Image</label>
                <div class="team-image-upload text-center p-4" style="border:2px dashed var(--border-panel);border-radius:16px;cursor:not-allowed;opacity:0.6;">
                    <i class="bi bi-cloud-arrow-up" style="font-size:48px;color:var(--accent);"></i>
                    <p class="mt-2 mb-0 text-secondary">Image upload coming soon</p>
                </div>
            </div>

            <!-- Shoutout -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Shoutout (Optional)</label>
                <textarea id="create-team-shoutout" class="form-control" rows="4" maxlength="500" placeholder="Give your team a short description..."></textarea>
            </div>

            <!-- Visibility -->
            <div class="mb-4">
                <label class="form-label fw-semibold d-block mb-3">Team Visibility</label>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="visibility-card active" data-type="public">
                            <div class="fw-bold"><i class="bi bi-globe me-2"></i>Public</div>
                            <small class="text-secondary">Anyone can discover and join.</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="visibility-card" data-type="private">
                            <div class="fw-bold"><i class="bi bi-lock-fill me-2"></i>Private</div>
                            <small class="text-secondary">Only invited members can join.</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-3">
                <button id="create-btn" class="btn btn-lg create-btn text-white">Create Team</button>
                <a href="/frontend/pages/user/team-search/index.html" class="btn btn-outline-light">Cancel</a>
            </div>

        </div>
    </section>

    <div id="footer"></div>

    <script src="/frontend/utils/core.js"></script>
    <script src="/frontend/components/navbar-user.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/services/teamService.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Visibility Toggle
        var visibilityCards = document.querySelectorAll('.visibility-card');
        visibilityCards.forEach(function (card) {
            card.addEventListener('click', function () {
                visibilityCards.forEach(function (c) { c.classList.remove('active'); });
                card.classList.add('active');
            });
        });

        // Create Team
        document.getElementById('create-btn').addEventListener('click', async function () {
            var btn = this;
            var name = document.getElementById('create-team-name').value.trim();
            var shoutout = document.getElementById('create-team-shoutout').value.trim();
            var activeCard = document.querySelector('.visibility-card.active');
            var isPublic = activeCard ? activeCard.getAttribute('data-type') === 'public' : true;
            var nameError = document.getElementById('create-team-name-error');
            nameError.classList.add('d-none');

            if (!name) {
                nameError.textContent = 'Team name is required';
                nameError.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating...';

            var res = await createTeam({
                name: name,
                shoutout: shoutout || null,
                isPublic: isPublic
            });

            btn.disabled = false;
            btn.textContent = 'Create Team';

            if (res && res.teamId) {
                window.location.href = '/frontend/pages/user/team/index.html?id=' + res.teamId;
            } else {
                var err = res ? res.error || 'Failed to create team' : 'Failed to create team';
                if (err.toLowerCase().indexOf('duplicate') !== -1 || err.toLowerCase().indexOf('already exist') !== -1) {
                    nameError.textContent = 'A team with this name already exists';
                } else {
                    nameError.textContent = err;
                }
                nameError.classList.remove('d-none');
            }
        });
    </script>

</body>

</html>
