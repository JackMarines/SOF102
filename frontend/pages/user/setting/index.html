<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">

    <link rel="icon" href="/frontend/assets/images/icon.png">

    <script>
        try {
            if (localStorage.getItem("theme") === "light") {
                document.documentElement.classList.add("light-mode");
            }
        } catch (e) { }
    </script>

</head>

<body data-auth="user">

    <div id="navbar"></div>

    <section class="container" style="margin-top:120px;margin-bottom:80px;">

        <!-- PAGE HEADER -->

        <div class="d-flex justify-content-between align-items-center flex-wrap mb-5">

            <div>

                <h2 class="fw-bold mb-1">

                    <i class="bi bi-gear-fill me-2"></i>

                    Settings

                </h2>

                <p class="text-secondary mb-0">

                    Manage your Puzzle Solve account preferences.

                </p>

            </div>

            <div class="mt-3 mt-lg-0">

                <button class="btn btn-outline-light me-2">

                    Cancel

                </button>

                <button class="custom-btn border-0">

                    Save Changes

                </button>

            </div>

        </div>

        <!-- APPEARANCE -->

        <div class="glass-box p-4 mb-4">

            <h5 class="fw-bold mb-3">

                <i class="bi bi-palette-fill me-2"></i>

                Appearance

            </h5>

            <p class="text-secondary">

                Choose how Puzzle Solve looks on your device.

            </p>

            <div class="row g-3 mt-2">

                <div class="col-md-4">

                    <div class="glass-box text-center p-4">

                        <i class="bi bi-display fs-2"></i>

                        <h6 class="mt-3">

                            System

                        </h6>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="glass-box text-center p-4">

                        <i class="bi bi-sun-fill fs-2"></i>

                        <h6 class="mt-3">

                            Light

                        </h6>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="glass-box text-center p-4">

                        <i class="bi bi-moon-stars-fill fs-2"></i>

                        <h6 class="mt-3">

                            Dark

                        </h6>

                    </div>

                </div>

            </div>

        </div>

        <!-- ACCOUNT -->

        <div class="glass-box p-4 mb-4">

            <h5 class="fw-bold mb-4">

                <i class="bi bi-person-circle me-2"></i>

                Account

            </h5>

            <div class="d-grid gap-3">

                <button class="btn btn-outline-light" id="changeEmailBtn">
                    <i class="bi bi-envelope-fill me-2"></i>
                    Change Email
                </button>

                <button class="btn btn-outline-light" id="changePasswordBtn">
                    <i class="bi bi-key-fill me-2"></i>
                    Change Password
                </button>

                <button class="btn btn-outline-light" id="logoutBtn">
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Logout
                </button>

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- COMPONENTS -->

    <script src="/frontend/utils/core.js"></script>

    <script src="/frontend/components/navbar-user.js"></script>

    <script src="/frontend/components/footer.js"></script>

    <script src="/frontend/components/spinner.js"></script>

    <script src="/frontend/services/warningService.js"></script>

    <script src="setting.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
