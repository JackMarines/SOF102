<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">
</head>

<body>



    <div id="navbar"></div>
    <!-- CONTENT -->
    <section class="puzzles-section">

        <div class="container">

            <!-- Page Header -->
            <div class="d-flex justify-content-center mb-3">
                <h1 class="page-title mb-0 text-center">Puzzles</h1>
            </div>

            <!-- Toolbar -->
            <div class="toolbar mb-3">
                <div class="search-box input-group mb-2">
                    <input type="text" id="input" class="form-control" placeholder="Search puzzles..." onkeydown="if(event.key==='Enter') searchPuzzles()">
                    <button class="btn" type="submit" id="searchButton" onclick=searchPuzzles()>
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" id="languageDropdown">
                            Language
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item">None</a></li>
                            <li><a class="dropdown-item">Python</a></li>
                            <li><a class="dropdown-item">Javascript</a></li>
                            <li><a class="dropdown-item">PHP</a></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" id="dropdownButton">
                            Difficulty
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" onclick="clearFilter()">None</a></li>
                            <li><a class="dropdown-item" onclick="sortPuzzlesDifficulty('Easy')">Easy</a></li>
                            <li><a class="dropdown-item" onclick="sortPuzzlesDifficulty('Medium')">Medium</a></li>
                            <li><a class="dropdown-item" onclick="sortPuzzlesDifficulty('Hard')">Hard</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="glass-box">
                <div class="table-header">
                    <span>#</span>
                    <span>Title</span>
                    <span>Language</span>
                    <span>Difficulty</span>
                </div>

                <div class="puzzle-list" id="puzzleList">
                </div>


            </div>
                            <div class="p-lg">
                    <div class="pagination" id="pagination">
                    </div>
                </div>

            <div id="footer"></div>

        </div>

    </section>

    <script src="/frontend/components/navbar-user.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>

    <!-- Các service của chúng ta -->
    <script src="/frontend/utils/constants.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/puzzleService.js"></script>
    <script src="/frontend/services/puzzleListService.js"></script>
    <script src="/frontend/services/authService.js"></script>
    <script src="puzzle.js"></script>




</body>

</html>
