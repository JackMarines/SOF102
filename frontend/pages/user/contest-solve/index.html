<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVCLIMB | Contest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/assets/css/tokens.css">
  <link rel="stylesheet" href="/frontend/assets/css/reset.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="icon" href="/frontend/assets/images/icon.png">

  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode'); } catch (e) {}
  </script>

  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-4px);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: var(--space-32px);
      transition: opacity 150ms ease-out;
    }

    .back-link:hover {
      opacity: 0.8;
    }

    .contest-detail-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--space-24px);
      align-items: start;
    }

    .contest-detail-left {
      display: flex;
      flex-direction: column;
      gap: var(--space-24px);
    }

    .contest-detail-right {
      display: flex;
      flex-direction: column;
      gap: var(--space-24px);
      position: sticky;
      top: calc(var(--nav-height) + var(--space-32px));
    }

    .leaderboard-scroll {
      max-height: 360px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-hover) transparent;
    }

    .leaderboard-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .leaderboard-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .leaderboard-scroll::-webkit-scrollbar-thumb {
      background: var(--border-hover);
    }

    /* ── Contest Header ── */

    .contest-header {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      overflow: hidden;
    }

    .contest-header-banner {
      height: 256px;
      background: var(--bg-elevated);
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border-default);
    }

    .contest-header-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(0.5) contrast(1.25);
    }

    .contest-header-banner .banner-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-base), transparent 60%);
      opacity: 0.6;
    }

    .contest-status-badge {
      position: absolute;
      bottom: var(--space-16px);
      left: var(--space-16px);
      padding: 3px 12px;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .contest-status-badge.active {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .contest-status-badge.ended {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
    }

    .contest-header-body {
      padding: var(--space-32px);
    }

    .contest-header-title {
      font-family: var(--font-mono);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      margin-bottom: var(--space-8px);
    }

    .contest-header-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-16px);
      margin-bottom: var(--space-24px);
    }

    .contest-header-author {
      font-size: 0.8125rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: var(--space-4px);
    }

    .contest-header-author:hover {
      color: var(--accent-hover);
    }

    .contest-header-dates {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: var(--space-4px);
    }

    .contest-header-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    /* ── Puzzle Section ── */

    .puzzle-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      overflow: hidden;
    }

    .puzzle-terminal-header {
      height: 24px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      padding: 0 var(--space-12px);
      cursor: pointer;
      transition: background 150ms ease-out;
      user-select: none;
    }

    .puzzle-terminal-header:hover {
      background: var(--bg-hover);
    }

    .puzzle-terminal-header .collapse-icon {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 200ms ease-out;
    }

    .sidebar-panel.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .sidebar-panel.collapsed .sidebar-body,
    .sidebar-panel.collapsed .leaderboard-scroll {
      display: none;
    }

    .puzzle-section .puzzle-terminal-header {
      cursor: default;
    }

    .puzzle-section .puzzle-terminal-header:hover {
      background: var(--bg-elevated);
    }

    .puzzle-terminal-header span {
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .puzzle-body {
      padding: var(--space-32px);
    }

    .puzzle-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-12px);
      margin-bottom: var(--space-24px);
    }

    .puzzle-title-row h2 {
      font-family: var(--font-mono);
      font-size: 1.125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .puzzle-badge {
      display: inline-block;
      padding: 2px 10px;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .puzzle-badge.hard {
      background: rgba(239, 68, 68, 0.12);
      color: var(--error);
    }

    .puzzle-badge.easy {
      background: rgba(34, 197, 94, 0.12);
      color: var(--success);
    }

    .puzzle-badge.medium {
      background: rgba(250, 189, 52, 0.12);
      color: var(--warning);
    }

    .puzzle-badge.lang {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-default);
    }

    .puzzle-badge.solved {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .puzzle-content {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-32px);
      white-space: pre-wrap;
    }

    .puzzle-example-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: var(--space-12px);
    }

    .puzzle-example-label::before {
      content: '# ';
    }

    .puzzle-example-block {
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      padding: var(--space-16px);
      margin-bottom: var(--space-24px);
    }

    .puzzle-example-block pre {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      line-height: 1.7;
      color: var(--text-secondary);
      white-space: pre;
      overflow-x: auto;
    }

    .puzzle-example-block .success {
      color: var(--success);
    }

    .puzzle-example-block .danger {
      color: var(--error);
    }

    .puzzle-example-block .muted {
      color: var(--text-muted);
    }

    .puzzle-example-block .err-text {
      color: var(--error);
    }

    /* ── Sidebar Panels ── */

    .sidebar-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      overflow: hidden;
    }

    .sidebar-panel .puzzle-terminal-header {
      height: 24px;
    }

    .sidebar-body {
      padding: var(--space-24px);
    }

    .sidebar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-12px) 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sidebar-row:last-child {
      border-bottom: none;
    }

    .sidebar-row .label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sidebar-row .value {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .sidebar-rules-heading {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: var(--space-24px);
      margin-bottom: var(--space-16px);
    }

    .sidebar-rules-heading::before {
      content: '# ';
    }

    .sidebar-rules-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-12px);
    }

    .sidebar-rules-list li {
      display: flex;
      align-items: flex-start;
      gap: var(--space-8px);
      font-size: 0.8125rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .sidebar-rules-list li .arrow {
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .reward-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      padding: var(--space-16px);
      text-align: center;
    }

    .reward-image {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 1px solid var(--border-default);
      margin: 0 auto var(--space-16px);
      display: block;
    }

    .reward-name {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--warning);
      margin-bottom: var(--space-8px);
    }

    .reward-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .reward-earned {
      margin-top: var(--space-12px);
      padding: 4px 12px;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      display: inline-block;
    }

    /* ── Solve Button ── */

    .solve-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-8px);
      margin-top: var(--space-24px);
    }

    .solve-btn .btn-devclimb.secondary {
      opacity: 0.8;
    }

    /* ── Responsive ── */

    @media (max-width: 1024px) {
      .contest-detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-auth="user">

<div class="scanline"></div>
<div id="navbar"></div>

<main style="padding-top: var(--nav-height);">
  <section class="section-page">
    <div class="container-page">

      <a class="back-link" href="/frontend/pages/user/contest/index.html">
        <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
        Back to Contests
      </a>

      <div class="contest-detail-grid">
        <div class="contest-detail-left" id="contest-left"></div>
        <div class="contest-detail-right" id="contest-right"></div>
      </div>

    </div>
  </section>
</main>

<div id="footer"></div>

<script src="/frontend/utils/core.js"></script>
<script src="/frontend/components/navbar-user.js"></script>
<script src="/frontend/components/footer.js"></script>
<script src="/frontend/components/theme-toggle.js"></script>
<script src="/frontend/components/spinner.js"></script>
<script src="/frontend/components/popup.js"></script>
<script src="/frontend/components/avatar.js"></script>
<script src="/frontend/services/contestService.js"></script>
<script src="contest-solve.js"></script>

</body>
</html>
