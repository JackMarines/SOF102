<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META TAGS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevClimb</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- EXTERNAL CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">

<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')}catch(e){}</script>
</head>

<body data-auth="user">

    <div id="navbar"></div>

    <section class="container" style="margin-top:120px; margin-bottom:80px;">

        <!-- Welcome -->
        <div class="glass-box p-4 mb-5">
            <h2 class="fw-bold">
                <i class="bi bi-hand-wave-fill text-warning"></i> Welcome back,
                <span style="color:#b388ff;" id="username">...</span>!
            </h2>
            <p class="text-secondary mb-0">Ready to solve today's challenge?</p>
        </div>

        <!-- Team Members -->
        <div class="mb-5" id="team-section">
            <h3 class="fw-semibold mb-4">Your Team</h3>
            <div class="row g-4" id="team-members"></div>
        </div>

        <!-- Weekly Puzzles -->
        <div class="mb-5" id="weekly-section">
            <h3 class="fw-semibold mb-3">Puzzles completed this week</h3>
            <div class="glass-box">
                <div class="table-header">
                    <span>Title</span>
                    <span>Language</span>
                    <span>Difficulty</span>
                </div>
                <div id="weekly-puzzles"></div>
            </div>
        </div>

        <!-- Team Activity -->
        <div id="activity-section">
            <h3 class="fw-semibold mb-3">Team Members' Latest Activity</h3>
            <div class="glass-box">
                <div class="table-header has-user">
                    <span>User</span>
                    <span>Puzzle</span>
                    <span>Language</span>
                    <span>Difficulty</span>
                </div>
                <div id="team-activity"></div>
            </div>
        </div>

    </section>

    <div id="footer"></div>

    <script src="/frontend/utils/core.js"></script>
    <script src="/frontend/components/navbar-user.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/components/avatar.js"></script>
    <script src="/frontend/services/warningService.js"></script>
    <script src="/frontend/services/homeService.js"></script>
    <script src="/frontend/pages/user/home/home.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
