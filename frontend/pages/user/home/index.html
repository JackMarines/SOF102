<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVCLIMB | Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/assets/css/tokens.css">
  <link rel="stylesheet" href="/frontend/assets/css/reset.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="icon" href="/frontend/assets/images/icon.png">

  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode'); } catch (e) {}
  </script>
</head>
<body data-auth="user">

<div class="scanline"></div>
<div id="navbar"></div>

<main id="main-content" role="main" style="padding-top: var(--nav-height);">
  <section class="section-page">
    <div class="container-page">

      <div class="content-panel pad-lg scroll-reveal" style="margin-bottom:var(--space-32px);">
        <h2 class="home-welcome">Welcome back, <span style="color:var(--accent);" id="username">...</span></h2>
        <p class="content-meta">Ready to solve today's challenge?</p>
      </div>

      <div style="margin-bottom:var(--space-32px);" id="team-section">
        <h3 class="content-section-heading">Your Team</h3>
        <div class="home-team-grid" id="team-members"></div>
        <div class="home-pagination" id="team-pagination">
          <button class="page-btn" id="team-prev" disabled>Prev</button>
          <span class="page-info" id="team-page-info">1 / 1</span>
          <button class="page-btn" id="team-next">Next</button>
        </div>
      </div>

      <div style="margin-bottom:var(--space-32px);" id="weekly-section">
        <h3 class="content-section-heading">Puzzles completed this week</h3>
        <div class="content-panel">
          <div class="table-header">
            <span>Title</span><span>Language</span><span>Difficulty</span>
          </div>
          <div id="weekly-puzzles"></div>
        </div>
      </div>

      <div id="activity-section">
        <h3 class="content-section-heading">Team Activity</h3>
        <div class="content-panel">
          <div class="table-header has-user">
            <span>User</span><span>Puzzle</span><span>Language</span><span>Difficulty</span>
          </div>
          <div id="team-activity"></div>
        </div>
      </div>

    </div>
  </section>
</main>

<div id="footer"></div>

<script src="/frontend/utils/core.js"></script>
<script src="/frontend/components/navbar-user.js"></script>
<script src="/frontend/components/footer.js"></script>
<script src="/frontend/components/theme-toggle.js"></script>
<script src="/frontend/components/scroll-reveal.js"></script>
<script src="/frontend/components/spinner.js"></script>
<script src="/frontend/components/skeleton.js"></script>
<script src="/frontend/components/avatar.js"></script>
<script src="/frontend/services/warningService.js"></script>
<script src="/frontend/services/homeService.js"></script>
<script src="/frontend/pages/user/home/home.js"></script>

</body>
</html>
