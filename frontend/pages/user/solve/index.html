<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puzzle Solve</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="stylesheet" href="/frontend/assets/css/solve.css">

    <link rel="icon" href="/frontend/assets/images/icon.png">


</head>

<body class="solve-page">

    <div id="navbar"></div>

    <!-- ===================== WORKSPACE ===================== -->

    <div class="workspace">

        <div class="top-panel">

            <!-- LEFT PANEL -->

            <section class="panel puzzle-panel" id="puzzlePanel">

            </section>

            <!-- RESIZER -->

            <div id="verticalResizer" class="vertical-resizer"></div>

            <!-- RIGHT TABBED PANEL -->
            <div class="right-tabbed">

                <!-- Tab bar -->
                <div class="solve-tabs panel-header">
                    <div class="solve-tabs-nav">
                        <button class="solve-tab active" data-tab="editor">Code Editor</button>
                        <button class="solve-tab" data-tab="results">Test Results</button>
                    </div>
                    <div class="solve-tabs-actions">
                        <div class="timer">
                            Time:
                            <span id="timer">00:00</span>
                        </div>
                        <button id="submitBtn" class="btn-submit">
                            <span><i class="bi bi-play-fill"></i></span>
                        </button>
                    </div>
                </div>

                <!-- Editor content -->
                <section class="panel editor-panel solve-tab-content active" data-tab-content="editor">
                    <div class="editor-body panel-content">
                        <div id="codeEditor"></div>
                    </div>
                </section>

                <!-- Result content -->
                <section class="panel result-panel solve-tab-content" data-tab-content="results">

                    <div class="panel-content">
                        <div class="status-row">
                            <span>Status</span>
                            <span id="statusText" class="pending">
                                Waiting...
                            </span>
                        </div>
                        <div class="status-row">
                            <span>Pass</span>
                            <span id="passResult">
                                false
                            </span>
                        </div>
                        <hr>
                        <div id="testCases">

                        </div>
                    </div>
                </section>

            </div>

        </div>

    </div>
    <script src="/frontend/components/navbar-user.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    
    <script src="/frontend/utils/constants.js"></script>
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/puzzleService.js"></script>
    <script src="/frontend/services/authService.js"></script>
    <script src="/frontend/services/puzzleSolveService.js"></script>
    <script src="/frontend/services/submissionService.js"></script>
    <script src="puzzle.js" type="module"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="/frontend/components/loading-overlay.js"></script>
<script src="/frontend/components/gsap-animations.js"></script>

</body>

</html>
