<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVCLIMB | Solve</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/assets/css/tokens.css">
  <link rel="stylesheet" href="/frontend/assets/css/reset.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="stylesheet" href="/frontend/assets/css/solve.css">
  <link rel="icon" href="/frontend/assets/images/icon.png">

  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode'); } catch (e) {}
  </script>
</head>
<body data-auth="user">

<div class="scanline"></div>
<div id="navbar"></div>

<div class="workspace">
  <div class="top-panel">

    <section class="panel puzzle-panel" id="puzzlePanel"></section>

    <div id="verticalResizer" class="vertical-resizer"></div>

    <div class="right-tabbed">
      <div class="solve-tabs panel-header">
        <div class="solve-tabs-nav">
          <button class="solve-tab active" data-tab="editor">Code Editor</button>
          <button class="solve-tab" data-tab="results">Test Results</button>
        </div>
        <div class="solve-tabs-actions">
          <div class="timer">
            Time:
            <span id="timer">00:00</span>
          </div>
          <button id="submitBtn" class="btn-submit">
            <span class="material-symbols-outlined" style="font-size:1rem;">play_arrow</span>
          </button>
        </div>
      </div>

      <section class="panel editor-panel solve-tab-content active" data-tab-content="editor">
        <div class="editor-body panel-content">
          <div id="codeEditor"></div>
        </div>
      </section>

      <section class="panel result-panel solve-tab-content" data-tab-content="results">
        <div class="panel-content">
          <div class="status-row">
            <span>Status</span>
            <span id="statusText" class="pending">Waiting...</span>
          </div>
          <div class="status-row">
            <span>Pass</span>
            <span id="passResult">false</span>
          </div>
          <hr>
          <div id="testCases"></div>
        </div>
      </section>
    </div>

  </div>
</div>

<script src="/frontend/utils/core.js"></script>
<script src="/frontend/components/navbar-user.js"></script>
<script src="/frontend/components/spinner.js"></script>
<script src="/frontend/services/puzzleService.js"></script>
<script src="/frontend/services/puzzleSolveService.js"></script>
<script src="/frontend/services/submissionService.js"></script>
<script src="solve.js"></script>
<script src="puzzle.js" type="module"></script>

</body>
</html>
