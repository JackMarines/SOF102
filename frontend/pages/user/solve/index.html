<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puzzle Solve</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">

    <link rel="icon" href="/frontend/assets/images/icon.png">

</head>

<body class="solve-page">

    <div id="navbar"></div>

    <!-- ===================== WORKSPACE ===================== -->

    <div class="workspace">

        <div class="top-panel">

            <!-- LEFT PANEL -->

            <section class="panel puzzle-panel" id="puzzlePanel">

               

            </section>

            <!-- RESIZER -->

            <div id="verticalResizer" class="vertical-resizer"></div>

            <!-- RIGHT PANEL -->
            <section class="panel editor-panel">

                <div class="panel-header editor-header">

                    <h3>Code Editor</h3>

                    <button id="submitBtn" class="btn-submit ms-auto">
                        <span><i class="bi bi-play-fill"></i></span>
                    </button>

                    <div class="timer">
                        Time:
                        <span id="timer">00:00</span>
                    </div>

                </div>

                <div class="editor-body panel-content">
                    <div id="codeEditor"></div>
                    <!-- <textarea id="codeEditor">
public class Solution {

    public int[] twoSum(int[] nums, int target) {

    }

}
</textarea> -->

                </div>



            </section>

        </div>

        <!-- Horizontal Resizer -->

        <div class="horizontal-resizer" id="horizontalResizer"></div>

        <!-- ===================== RESULT ===================== -->

        <section class="panel result-panel">

            <div class="panel-header">

                <h3>Test Results</h3>

            </div>

            <div class="panel-content">

                <div class="status-row">

                    <span>Status</span>

                    <span id="statusText" class="pending">
                        Waiting...
                    </span>

                </div>

                <div class="status-row">

                    <span>Pass</span>

                    <span id="passResult">
                        false
                    </span>

                </div>

                <hr>

                <div id="testCases">

                    <p class="placeholder">

                        Press Submit to run testcases...

                    </p>

                </div>

            </div>

        </section>

    </div>
    <script src="/frontend/components/navbar-user.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    
    <script src="/frontend/utils/constants.js"></script>
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/puzzleService.js"></script>
    <script src="/frontend/services/authService.js"></script>
    <script src="/frontend/services/puzzleSolveService.js"></script>
    <script src="puzzle.js" type="module"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
