<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">

    <link rel="icon" href="/frontend/assets/images/icon.png">


</head>

<body >

  

    <!-- ERROR PAGE -->

    <section class="container" style="margin-top:120px;
               margin-bottom:80px;">

        <div class="row justify-content-center">

            <div class="col-lg-8 col-xl-7">

                <div class="glass-box p-5 text-center">

                    <!-- ICON -->

                    <div class="mb-4">

                        <div class="mx-auto rounded-circle d-flex justify-content-center align-items-center" style="width:120px;
                                   height:120px;
                                   background:#120924;
                                   border:3px solid #b388ff;">

                            <i class="bi bi-exclamation-octagon-fill" style="font-size:60px;color:#b388ff;"></i>

                        </div>

                    </div>

                    <!-- 404 -->

                    <h1 class="fw-bold mb-0" style="font-size:110px;
                               line-height:1;
                               color:#b388ff;">

                        404

                    </h1>

                    <h2 class="fw-bold mt-3">

                        Oops! Page Not Found

                    </h2>

                    <p class="text-secondary mt-3 mb-4" style="max-width:600px;
                               margin:auto;">

                        The page you are looking for doesn't exist,
                        may have been moved,
                        or the link is incorrect.

                    </p>

                   


                </div>

            </div>

        </div>

    </section>

    <!-- FOOTER -->


    <!-- COMPONENTS -->




    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
