<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">

<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')}catch(e){}</script>
</head>

<body>

    <div id="navbar"></div>

    <section class="container" style="margin-top:120px; margin-bottom:80px;">

        <!-- PROFILE -->
        <div class="glass-box p-4 mb-5">

            <div class="row align-items-center">

                <div class="col-md-2 text-center">

                    <div id="profile-avatar" class="mx-auto d-inline-block"></div>

                </div>

                <div class="col-md-7">

                    <h2 class="fw-bold mb-2" id="profile-displayname">Loading...</h2>

                    <p class="text-secondary mb-3" id="profile-bio"></p>

                    <p class="mb-1">
                        <strong>Group:</strong> <span id="profile-group">-</span>
                    </p>

                    <p class="mb-0">
                        <strong>Total Score:</strong> <span id="profile-score">0</span>
                        &middot;
                        <span id="profile-completed">0</span> puzzles solved
                    </p>

                </div>

                <div class="col-md-3 text-md-end mt-4 mt-md-0" id="edit-btn-wrapper">

                </div>

            </div>

        </div>

        <!-- GROUP -->

        <h3 class="fw-bold mb-3" id="group-heading">My Group</h3>

        <div class="glass-box p-4 mb-5" id="group-box">

            <div class="d-flex align-items-center">

                <div class="rounded-circle d-flex justify-content-center align-items-center me-4"
                    style="width:90px;height:90px;background:#241243;">

                    <i class="bi bi-people-fill" style="font-size:42px;"></i>

                </div>

                <div>

                    <h4 class="mb-1" id="group-name">-</h4>

                    <p class="text-secondary mb-0" id="group-members"></p>

                </div>

            </div>

        </div>

        <!-- SOLVED PUZZLES -->

        <h3 class="fw-bold mb-3">
            Solved Puzzles
        </h3>

        <div class="glass-box p-4" id="solved-box">

            <div id="solved-table"></div>

        </div>

    </section>

    <!-- EDIT PROFILE MODAL -->

    <div class="modal fade" id="editProfileModal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content glass-box">

                <div class="modal-header border-0">

                    <h5 class="modal-title">
                        Edit Profile
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Avatar
                        </label>

                        <input type="file" class="form-control" id="edit-avatar-input" accept="image/*">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text" class="form-control" id="edit-username-input">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Bio
                        </label>

                        <textarea class="form-control" id="edit-bio-input"
                            rows="4"></textarea>

                    </div>

                </div>

                <div class="modal-footer border-0">

                    <button class="custom-btn border-0" id="save-profile-btn">
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div id="footer"></div>

    <!-- COMPONENTS -->
    <script src="/frontend/components/navbar-user.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/components/avatar.js"></script>
    <script src="/frontend/components/puzzle-table.js"></script>

    <!-- SERVICES -->
    <script src="/frontend/utils/constants.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/authService.js"></script>
    <script src="/frontend/services/profileService.js"></script>

    <!-- Orchestrator -->
    <script src="profile.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
