<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="puzzle.css">
    <link rel="icon" href="/frontend/assets/css/icon.png">
</head>

<body>



    <!-- ===================== NAVBAR ===================== -->

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" href="http://127.0.0.1:5500/frontend/index.html">
                <img src="/frontend/assets/css/logo.png" class="logo" alt="Logo">

            </a>

            <!-- Mobile -->

            <div class="d-flex align-items-center d-lg-none ms-auto">

                <a href="../profile/index.html" class="profile-btn me-2">

                    <i class="bi bi-person-circle"></i>

                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                    <span class="navbar-toggler-icon"></span>

                </button>

            </div>

            <!-- Menu -->

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="#">
                            Help
                        </a>

                    </li>

                    <a class="nav-link" href="../puzzle/index.html">
                        Puzzles
                    </a>

                    <li class="nav-item">

                        <a class="nav-link" href="http://127.0.0.1:5500/frontend/index.html">
                            Home
                        </a>

                    </li>
                    <li class="nav-item ms-lg-3 d-none d-lg-block">

                        <a href="../profile/index.html" class="profile-btn">

                            <i class="bi bi-person-circle"></i>

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>
    <!-- CONTENT -->
    <section class="puzzles-section">

        <div class="container">
            <a href="">
                <h1 class="page-title">Puzzles</h1>

            </a>

            <!-- Search UI -->
            <div class="search-box input-group">
                <input type="text" id="input" class="form-control" placeholder="Search puzzles..." onkeydown="if(event.key==='Enter') searchPuzzles()">
                <button class="btn" type="submit" id="searchButton" onclick=searchPuzzles()>
                    <i class="bi bi-search"></i>
                </button>
            </div>

            <!-- Dropdown filter -->

            <div class="d-flex">
                <div class="dropdown ms-auto">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" id="dropdownButton">
                        Difficulty
                    </button>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" onclick="clearFilter()">None</a></li>
                        <li><a class="dropdown-item" onclick="sortPuzzlesDifficulty('Easy')">Easy</a></li>
                        <li><a class="dropdown-item" onclick="sortPuzzlesDifficulty('Medium')">Medium</a></li>
                        <li><a class="dropdown-item" onclick="sortPuzzlesDifficulty('Hard')">Hard</a></li>
                    </ul>
                </div>
            </div>


            <!-- Table Header -->
            <div class="table-header">
                <span>#</span>
                <span>Title</span>
                <span>Language</span>
                <span>Difficulty</span>
            </div>

            <!-- List -->
            <div class="puzzle-list" id="puzzleList">
            </div>

            <!-- Pagination UI -->
            <div class="pagination" id="pagination">
            </div>

            <!-- FOOTER -->
            <footer class="footer">
                © 2025 JackCode. All rights reserved.
            </footer>
    </section>

    <!-- Các service của chúng ta -->
    <script src="/frontend/utils/constants.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/puzzleService.js"></script>
    <script src="/frontend/services/authService.js"></script>
    <script src="puzzle.js"></script>




</body>

</html>
