<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">

    <link rel="icon" href="/frontend/assets/images/icon.png">

    <script>
        try {
            if (localStorage.getItem('theme') === 'light')
                document.documentElement.classList.add('light-mode')
        } catch (e) { }
    </script>

</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- ================= CONTENT ================= -->

    <section class="container" style="margin-top:120px; margin-bottom:80px;">

        <!-- Team Banner -->
        <div class="glass-box position-relative overflow-hidden mb-5 tt-banner">

            <img id="team-banner" src="/frontend/assets/images/team-banner.png" class="w-100 tt-banner-img"
                style="height:320px;object-fit:cover;">

            <div class="tt-banner-overlay"></div>

            <div class="position-absolute top-50 start-0 translate-middle-y w-100 px-5 tt-banner-info">

                <div class="row align-items-center">

                    <div class="col-lg-9">

                        <h1 class="fw-bold mb-3 text-white">
                            <span id="team-name"></span>
                            <span id="team-visibility-badge" class="badge ms-2"></span>
                        </h1>

                        <div id="team-owner-wrapper" class="mb-2">
                            <div id="team-owner" class="d-inline-flex align-items-center gap-2 text-decoration-none" style="color: inherit;"></div>
                        </div>

                        <div id="join-btn-wrapper" class="mt-3"></div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Group Shoutout -->
        <div class="glass-box p-4 mb-4">

            <div class="d-flex align-items-center mb-3">
                <h4 class="fw-bold mb-0">
                    <i class="bi bi-megaphone-fill text-warning"></i>
                    Group Shoutout
                </h4>
            </div>

            <p id="team-shoutout" class="mb-0"></p>

        </div>

        <div class="row g-4">

            <!-- LEFT -->
            <div class="col-lg-8">

                <!-- MEMBERS TABLE -->
                <div class="glass-box p-4">

                    <h4 class="fw-bold mb-4">
                        <i class="bi bi-people-fill"></i>
                        Members
                    </h4>

                    <div id="member-table"></div>

                </div>

            </div>

            <!-- RIGHT -->
            <div class="col-lg-4">

                <!-- PERFORMANCE -->
                <div class="glass-box p-4 mb-4">

                    <h4 class="fw-bold mb-4">
                        Performance Matrix
                    </h4>

                    <p class="mb-1">Group Throughput</p>
                    <div class="progress mb-3">
                        <div id="perf-throughput-bar" class="progress-bar" style="width:0%"></div>
                    </div>
                    <p id="perf-throughput-text" class="text-end text-secondary small mb-4">0%</p>

                    <div class="row text-center">

                        <div class="col">
                            <div class="glass-box p-3">
                                <h5 id="perf-total-solved">0</h5>
                                <small>Solved</small>
                            </div>
                        </div>

                        <div class="col">
                            <div class="glass-box p-3">
                                <h5 id="perf-total-score">0</h5>
                                <small>Total Score</small>
                            </div>
                        </div>

                    </div>

                </div>

                <!-- TOP CONTRIBUTORS -->
                <div class="glass-box p-4">

                    <h4 class="fw-bold mb-4">
                        <i class="bi bi-trophy-fill text-warning"></i>
                        Top Contributors
                    </h4>

                    <div id="top-contributors"></div>

                </div>

            </div>

        </div>

    </section>

    <div id="footer"></div>

    <!-- Components -->
    <script src="/frontend/utils/core.js"></script>
    <script src="/frontend/components/navbar-guest.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/components/avatar.js"></script>
    <script src="/frontend/components/user-table.js"></script>
    <script src="/frontend/services/teamService.js"></script>

    <!-- Orchestrator -->
    <script src="/frontend/pages/guest/team/team.js"></script>

    <script>redirectIfAuthenticated();</script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
