<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVCLIMB | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/assets/css/tokens.css">
  <link rel="stylesheet" href="/frontend/assets/css/reset.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="icon" href="/frontend/assets/images/devclimbicon.png">

  <script>
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    } catch (e) {}
  </script>
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
</head>
<body>

<div class="scanline"></div>

<div id="navbar"></div>

<main id="main-content" role="main" style="padding-top: var(--nav-height);">
  <section class="auth-page">
    <div class="auth-card scroll-reveal">
      <h1 class="auth-heading">System Login</h1>
      <p class="auth-sub">Authenticate to continue your session</p>

      <form class="auth-form" id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <div class="auth-forgot-link">
          <a href="forgot-password.html">Recover access</a>
        </div>

        <div class="auth-error" id="loginError"></div>

        <button type="submit" class="auth-btn">Authenticate</button>

        <p class="auth-link">
          Don't have an account? <a href="register.html">Initialize one</a>
        </p>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="oauth-row">
        <button type="button" class="oauth-btn" id="googleBtn">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.7 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.6c-.3 1.5-1.1 2.7-2.3 3.6v3h3.7c2.2-2 3.4-4.9 3.4-8.7z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-3c-1 .7-2.4 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3.1C3.7 21.4 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.6 14.6c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.9H1.8C1 8.5.5 10.2.5 12s.5 3.5 1.3 5.1l3.8-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.4 15.1.5 12 .5 7.5.5 3.7 3.1 1.8 6.9l3.8 3.1c.9-2.7 3.4-4.7 6.4-4.7z"/></svg>
          Google
        </button>
        <button type="button" class="oauth-btn" id="githubBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </button>
      </div>
    </div>
  </section>
</main>

<div id="footer"></div>

<script src="/frontend/utils/core.js"></script>
<script src="/frontend/components/navbar-guest.js"></script>
<script src="/frontend/components/footer-guest.js"></script>
<script src="/frontend/components/theme-toggle.js"></script>
<script src="/frontend/components/scroll-reveal.js"></script>
<script src="/frontend/components/spinner.js"></script>
<script src="/frontend/services/authUiService.js"></script>
<script src="/frontend/pages/guest/auth/auth.js"></script>
<script>window.addEventListener('deps-ready', function() { if (typeof redirectIfAuthenticated === 'function') redirectIfAuthenticated(); })</script>

<script src="/frontend/components/gsap-navbar-shuffle.js"></script>
</body>
</html>
