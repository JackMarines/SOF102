<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/frontend/pages/guest/auth/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">

</head>

<body>

    <div id="navbar"></div>


    <!-- Login -->
    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="login-card">

                        <h1 class="title">
                            Welcome Back
                        </h1>

                        <p class="subtitle">
                            Sign in to continue coding
                        </p>

                        <form id="loginForm">

                            <div>

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email" id="email" class="form-control" placeholder="Enter email">

                            </div>

                            <div class="mt-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password" id="password" class="form-control" placeholder="Enter password">

                            </div>

                            <div id="loginError" class="auth-error"></div>

                            <p class="register-link mt-3">

                                Don't have an account?

                                <a href="register.html">
                                    Register here
                                </a>

                            </p>
                            <button type="submit" class="login-btn mt-4">
                                Login
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <div id="footer"></div>

    <script src="/frontend/components/navbar-guest.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>

    <!-- Firebase App + Auth SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Các service của chúng ta -->
    <script src="/frontend/utils/constants.js"></script>
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/authService.js"></script>
    <script src="/frontend/services/authUiService.js"></script>
    <script src="/frontend/pages/guest/auth/auth.js"></script>


    <script>redirectIfAuthenticated()</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
