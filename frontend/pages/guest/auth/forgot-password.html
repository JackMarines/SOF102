<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">

<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')}catch(e){}</script>
</head>

<body>

    <div id="navbar"></div>


    <!-- Forgot Password -->
    <section class="auth-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="auth-card" id="forgotCard">

                        <h1 class="title">
                            Reset Password
                        </h1>

                        <p class="subtitle">
                            Enter your email to receive a reset link
                        </p>

                        <form id="forgotForm">

                            <div>

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email" id="resetEmail" class="form-control" placeholder="Enter email">

                            </div>

                            <div id="forgotError" class="auth-error"></div>

                            <p class="auth-link mt-3">

                                Remember your password?

                                <a href="login.html">
                                    Back to login
                                </a>

                            </p>
                            <button type="submit" class="auth-btn mt-4">
                                Send Reset Link
                            </button>

                        </form>

                    </div>

                    <!-- Success state (hidden by default) -->
                    <div class="auth-card d-none" id="forgotSuccess">

                        <h1 class="title">
                            Check Your Email
                        </h1>

                        <p class="subtitle" id="successEmail">
                            We sent a password reset link to your email address.
                        </p>

                        <div style="text-align:center;padding:24px 36px 32px;">
                            <p style="color:var(--text-3);font-size:13px;line-height:1.7;margin-bottom:20px;">
                                Click the link in the email to set a new password.<br>
                                The link will expire in 1 hour.
                            </p>

                            <a href="login.html" class="auth-btn" style="display:inline-block;text-decoration:none;">
                                Back to Login
                            </a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <div id="footer"></div>

    <script src="/frontend/utils/core.js"></script>
    <script src="/frontend/components/navbar-guest.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/services/authUiService.js"></script>
    <script src="/frontend/pages/guest/auth/forgot-password.js"></script>

    <script>redirectIfAuthenticated()</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
