<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVCLIMB | Recover Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/assets/css/tokens.css">
  <link rel="stylesheet" href="/frontend/assets/css/reset.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="icon" href="/frontend/assets/images/devclimbicon.png">

  <script>
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    } catch (e) {}
  </script>
</head>
<body>

<div class="scanline"></div>

<div id="navbar"></div>

<main id="main-content" role="main" style="padding-top: var(--nav-height);">
  <section class="auth-page">
    <div class="auth-card scroll-reveal" id="forgotCard">
      <h1 class="auth-heading">Recover Access</h1>
      <p class="auth-sub">Enter your email to receive a reset link</p>

      <form class="auth-form" id="forgotForm">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="Enter email">

        <div class="auth-error" id="forgotError"></div>

        <button type="submit" class="auth-btn">Send Recovery Link</button>

        <p class="auth-link">
          Remember your password? <a href="login.html">Back to login</a>
        </p>
      </form>
    </div>

    <div class="auth-card scroll-reveal d-none" id="forgotSuccess">
      <h1 class="auth-heading">Check Your Inbox</h1>
      <p class="auth-sub" id="successEmail">
        We sent a password reset link to your email address.
      </p>
      <div style="padding: 12px 0;">
        <p style="font-size:0.8125rem;color:var(--text-muted);line-height:1.7;margin-bottom:20px;">
          Click the link in the email to set a new password.<br>
          The link expires in 1 hour.
        </p>
        <a href="login.html" class="auth-btn" style="display:block;text-align:center;text-decoration:none;">Back to Login</a>
      </div>
    </div>
  </section>
</main>

<div id="footer"></div>

<script src="/frontend/utils/core.js"></script>
<script src="/frontend/components/navbar-guest.js"></script>
<script src="/frontend/components/footer-guest.js"></script>
<script src="/frontend/components/theme-toggle.js"></script>
<script src="/frontend/components/scroll-reveal.js"></script>
<script src="/frontend/components/spinner.js"></script>
<script src="/frontend/services/authUiService.js"></script>
<script src="/frontend/pages/guest/auth/forgot-password.js"></script>
<script>window.addEventListener('deps-ready', function() { if (typeof redirectIfAuthenticated === 'function') redirectIfAuthenticated(); })</script>

</body>
</html>
