<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')}catch(e){}</script>
</head>

<body>

    <div id="navbar"></div>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-7">

                    <div class="auth-card">

                        <h1 class="title">Create Account</h1>

                        <p class="subtitle">
                            Register to start coding
                        </p>

                        <form id="registerForm">

                            <div class="mb-3">
                                <label class="form-label">
                                    Username
                                </label>

                                <input type="text" id="regUsername" class="form-control" placeholder="Enter username">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email" id="regEmail" class="form-control" placeholder="Enter email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password" id="regPassword" class="form-control"
                                    placeholder="Enter password">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password" id="regConfirm" class="form-control"
                                    placeholder="Confirm password">
                            </div>

                            <div id="registerError" class="auth-error"></div>

                            <p class="auth-link mt-3">

                                Already have an account?

                                <a href="login.html">
                                    Login here
                                </a>

                            </p>

                            <button type="submit" class="auth-btn mt-4">
                                Register
                            </button>

                        </form>

                    </div>

                </div>

            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="/frontend/components/navbar-guest.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>

    <!-- Firebase App + Auth SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Các service của chúng ta -->
    <script src="/frontend/utils/constants.js"></script>
    <script src="/frontend/services/api.js"></script>
    <script src="/frontend/services/authService.js"></script>
    <script src="/frontend/services/authUiService.js"></script>
    <script src="/frontend/pages/guest/auth/auth.js"></script>

    <script>redirectIfAuthenticated()</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
