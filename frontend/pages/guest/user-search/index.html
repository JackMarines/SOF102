<!-- Guest user search page — browse players without logging in -->
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Search</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">

    <link rel="icon" href="/frontend/assets/images/icon.png">

    <script>
        try {
            if (localStorage.getItem('theme') === 'light')
                document.documentElement.classList.add('light-mode')
        } catch (e) { }
    </script>

</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>
    <!-- ================= CONTENT ================= -->

    <section class="container" style="margin-top:120px; margin-bottom:80px;">

        <h1 class="page-title mb-5">
            Find Players
        </h1>

        <!-- User Table -->
        <div id="user-table" class="glass-box p-4"></div>

    </section>

    <div id="footer"></div>

    <!-- Components -->
    <script src="/frontend/utils/core.js"></script>
    <script src="/frontend/components/navbar-guest.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/components/avatar.js"></script>
    <script src="/frontend/components/user-table.js"></script>
    <script src="/frontend/services/userSearchService.js"></script>

    <!-- Orchestrator -->
    <script src="search.js"></script>

    <script>redirectIfAuthenticated();</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
