<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVCLIMB | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/assets/css/tokens.css">
  <link rel="stylesheet" href="/frontend/assets/css/reset.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="stylesheet" href="/frontend/components/tables.css">
  <link rel="icon" href="/frontend/assets/images/icon.png">

  <script>
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    } catch (e) {}
  </script>
</head>
<body>

<div class="scanline"></div>

<div id="navbar"></div>

<main id="main-content" role="main" style="padding-top: var(--nav-height);">
  <section class="section-page">
    <div class="container-page">

      <div style="text-align:right;margin-bottom:var(--space-24px);">
        <a href="/frontend/pages/guest/user-search/index.html" class="content-link">
          Explore more users <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">arrow_forward</span>
        </a>
      </div>

      <div class="content-panel pad-lg scroll-reveal">
        <div style="display:flex;align-items:center;gap:var(--space-32px);flex-wrap:wrap;">
          <div id="profile-avatar" style="flex-shrink:0;"></div>
          <div style="flex:1;min-width:0;">
            <h2 class="content-section-heading" id="profile-displayname" style="margin-bottom:var(--space-8px);word-break:break-word;">Loading...</h2>
            <p class="content-meta" id="profile-bio" style="margin-bottom:var(--space-16px);"></p>
            <p style="font-size:0.8125rem;color:var(--text-secondary);">
              <strong style="color:var(--text-primary);">Total Score:</strong> <span id="profile-score">0</span>
              <span style="color:var(--border-default);margin:0 var(--space-8px);">&middot;</span>
              <span id="profile-completed">0</span> puzzles solved
            </p>
          </div>
          <div id="edit-btn-wrapper" style="flex-shrink:0;"></div>
        </div>
      </div>

      <h3 class="content-section-heading" id="group-heading">Group</h3>

      <a class="content-panel" id="group-box" href="#" style="display:block;text-decoration:none;color:inherit;cursor:default;">
        <div style="display:flex;align-items:center;gap:var(--space-24px);">
          <div style="width:90px;height:90px;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-default);overflow:hidden;flex-shrink:0;">
            <img id="group-avatar-img" class="profile-group-avatar" alt="" style="display:none;">
            <span id="group-avatar-fallback" class="material-symbols-outlined" style="font-size:42px;color:var(--text-muted);">group</span>
          </div>
          <div>
            <h4 style="font-family:var(--font-mono);font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--space-4px);" id="group-name">-</h4>
            <p class="content-meta" id="group-members"></p>
          </div>
        </div>
      </a>

      <h3 class="content-section-heading" style="margin-top:var(--space-32px);">Solved Puzzles</h3>

      <div class="content-panel" id="solved-box">
        <div id="solved-table"></div>
      </div>

    </div>
  </section>
</main>

<div id="footer"></div>

<script src="/frontend/utils/core.js"></script>
<script src="/frontend/components/navbar-guest.js"></script>
<script src="/frontend/components/footer.js"></script>
<script src="/frontend/components/theme-toggle.js"></script>
<script src="/frontend/components/scroll-reveal.js"></script>
<script src="/frontend/components/spinner.js"></script>
<script src="/frontend/components/skeleton.js"></script>
<script src="/frontend/components/avatar.js"></script>
<script src="/frontend/components/puzzle-table.js"></script>
<script src="/frontend/services/profileService.js"></script>
<script src="profile.js"></script>

</body>
</html>
