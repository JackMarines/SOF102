<!-- Guest profile page — read-only view of any user's profile -->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">

<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')}catch(e){}</script>
</head>

<body>

    <div id="navbar"></div>

    <section class="container" style="margin-top:120px; margin-bottom:80px;">

        <!-- PROFILE -->
        <div class="glass-box p-4 mb-5">

            <div class="row align-items-center">

                <div class="col-md-2 text-center">

                    <div id="profile-avatar" class="mx-auto d-inline-block"></div>

                </div>

                <div class="col-md-7">

                    <h2 class="fw-bold mb-2" id="profile-displayname" style="overflow-wrap:break-word;">Loading...</h2>

                    <p class="text-secondary mb-3" id="profile-bio"></p>

                    <p class="mb-1">
                        <strong>Group:</strong> <span id="profile-group" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">-</span>
                    </p>

                    <p class="mb-0">
                        <strong>Total Score:</strong> <span id="profile-score">0</span>
                        &middot;
                        <span id="profile-completed">0</span> puzzles solved
                    </p>

                </div>

            </div>

        </div>

        <!-- GROUP -->

        <h3 class="fw-bold mb-3" id="group-heading">Group</h3>

        <a class="glass-box p-4 mb-5 d-block text-decoration-none" id="group-box" href="#" style="color:inherit;cursor:default;">

            <div class="d-flex align-items-center">

                <div class="rounded-circle d-flex justify-content-center align-items-center me-4"
                    style="width:90px;height:90px;background:#241243;">

                    <i class="bi bi-people-fill" style="font-size:42px;"></i>

                </div>

                <div>

                    <h4 class="mb-1" id="group-name">-</h4>

                    <p class="text-secondary mb-0" id="group-members"></p>

                </div>

            </div>

        </a>

        <!-- SOLVED PUZZLES -->

        <h3 class="fw-bold mb-3">
            Solved Puzzles
        </h3>

        <div class="glass-box p-4" id="solved-box">

            <div id="solved-table"></div>

        </div>

    </section>

    <div id="footer"></div>

    <!-- COMPONENTS -->
    <script src="/frontend/utils/core.js"></script>
    <script src="/frontend/components/navbar-guest.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/components/avatar.js"></script>
    <script src="/frontend/components/puzzle-table.js"></script>
    <script src="/frontend/services/profileService.js"></script>

    <!-- Orchestrator -->
    <script src="profile.js"></script>

    <script>redirectIfAuthenticated();</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
