<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problems</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./problems.css">
</head>

<body>

    <!-- NAVBAR (copy từ login, giữ nguyên) -->
    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="#">
                <h2 class="logo-text">
                    <img src="" alt="logo">
                </h2>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                ☰
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto text-center">

                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Problems</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTENT -->
    <section class="problems-section">

        <div class="container">

            <h1 class="page-title">Problems</h1>

            <!-- Search UI -->
            <div class="search-box">
                <input type="text" placeholder="Search problems...">
            </div>

            <!-- Table Header -->
            <div class="table-header">
                <span>#</span>
                <span>Title</span>
                <span>Language</span>
                <span>Difficulty</span>
            </div>

            <!-- List -->
            <div class="problem-list">

                <div class="problem-item">
                    <span class="id">1</span>
                    <span class="title">Two Sum</span>
                    <span class="lang">JavaScript</span>
                    <span class="easy">Easy</span>
                </div>

                <div class="problem-item">
                    <span class="id">2</span>
                    <span class="title">Binary Search</span>
                    <span class="lang">Python</span>
                    <span class="medium">Medium</span>
                </div>

                <div class="problem-item">
                    <span class="id">3</span>
                    <span class="title">Merge Intervals</span>
                    <span class="lang">Java</span>
                    <span class="hard">Hard</span>
                </div>

                <div class="problem-item">
                    <span class="id">4</span>
                    <span class="title">Valid Parentheses</span>
                    <span class="lang">JavaScript</span>
                    <span class="easy">Easy</span>
                </div>

            </div>

            <!-- Pagination UI -->
            <div class="pagination">
                <span>Prev</span>
                <span class="active">1</span>
                <span>2</span>
                <span>3</span>
                <span>Next</span>
            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        © 2025 JackCode. All rights reserved.
    </footer>

</body>

</html>
