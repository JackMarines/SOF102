<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
    <link rel="icon" href="/frontend/assets/css/icon.png">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" href="../../index.html">
                <img src="/frontend/assets/css/logo.png" alt="Logo" class="logo">
            </a>

            <!-- Button Mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto align-items-lg-center text-center">

                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">
                            Help
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../puzzle/index.html">
                            Puzzles
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link current-link" href="login.html">
                            Log in
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Register Section -->
    <section class="register-section">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-7">

                    <div class="register-card">

                        <h1 class="title">Create Account</h1>

                        <p class="subtitle">
                            Register to start coding
                        </p>

                        <form>

                            <div class="mb-3">
                                <label class="form-label">
                                    Username
                                </label>

                                <input type="text" class="form-control" placeholder="Enter username">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email" class="form-control" placeholder="Enter email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password" class="form-control" placeholder="Enter password">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password" class="form-control" placeholder="Confirm password">
                            </div>

                            <p class="login-link mt-3">

                                Already have an account?

                                <a href="login.html">
                                    Login here
                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>
        </div>
    </section>

    <!-- FOOTER -->

    <footer>

        <div class="container text-center">
            © 2026 JackCode - Coding Game Platform
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
