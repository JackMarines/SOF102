<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">

<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')}catch(e){}</script>
</head>

<body>


    <!-- Login -->
    <section class="auth-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="auth-card">

                        <h1 class="title">
                            Admin login
                        </h1>

                        <p class="subtitle">
                            This is a page for login for admin page!
                            Please contact another staff if you have problem logging in.
                        </p>

                        <form id="loginForm">

                            <div>

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email" id="email" class="form-control" placeholder="Enter email">

                            </div>

                            <div class="mt-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password" id="password" class="form-control" placeholder="Enter password">

                            </div>


                            <div id="loginError" class="auth-error"></div>

                            <button type="submit" class="auth-btn mt-4">
                                Login
                            </button>

                        </form>


                    </div>

                </div>

            </div>

        </div>

    </section>

    <div id="footer"></div>

    <script src="/frontend/utils/core.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/components/spinner.js"></script>
    <script src="/frontend/services/authUiService.js"></script>
    <script src="/frontend/pages/guest/auth/auth.js"></script>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
