<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Maintenance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="icon" href="/frontend/assets/images/icon.png">

    <script>
        try {
            if (localStorage.getItem("theme") === "light")
                document.documentElement.classList.add("light-mode");
        } catch (e) { }
    </script>

</head>

<body>

    <section class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">

        <div class="glass-box p-5 text-center" style="max-width:520px;">

            <div class="mb-4">

                <div class="mx-auto rounded-circle d-flex justify-content-center align-items-center" style="width:120px;
                           height:120px;
                           background:#120924;
                           border:3px solid #b388ff;">

                    <i class="bi bi-gear-fill" style="font-size:60px;color:#b388ff;"></i>

                </div>

            </div>

            <h2 class="fw-bold">

                Under Maintenance

            </h2>

            <p class="text-secondary mt-3 mb-0" style="max-width:400px;margin:auto;">

                We're currently performing scheduled maintenance.
                <br><br>
                Please revisit later.

            </p>

        </div>

    </section>

</body>

</html>
