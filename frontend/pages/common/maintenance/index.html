<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVCLIMB | Maintenance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/assets/css/tokens.css">
  <link rel="stylesheet" href="/frontend/assets/css/reset.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="icon" href="/frontend/assets/images/devclimbicon.png">

  <script>
    try {
      if (localStorage.getItem("theme") === "light")
        document.documentElement.classList.add("light-mode");
    } catch (e) { }
  </script>
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
</head>
<body>

<div class="scanline"></div>

<main id="main-content" role="main" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-lg);">
  <section class="auth-card" style="text-align:center;max-width:520px;">
    <div style="width:120px;height:120px;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-lg);background:var(--bg-card);">
      <span class="material-symbols-outlined" style="font-size:60px;line-height:1;color:var(--accent);">build</span>
    </div>

    <h1 class="auth-heading">Under Maintenance</h1>

    <p class="auth-sub" style="max-width:400px;margin:var(--space-md) auto 0;">
      We're currently performing scheduled maintenance. Please revisit later.
    </p>

    <a href="/frontend/pages/common/announcement/index.html" class="auth-btn" style="display:inline-block;text-decoration:none;margin-top:var(--space-lg);">
      <span class="material-symbols-outlined" style="font-size:1rem;vertical-align:middle;margin-right:var(--space-xs);">campaign</span>
      View Announcements
    </a>
  </section>
</main>

<script src="/frontend/components/gsap-navbar-shuffle.js"></script>
</body>
</html>
